spring:
  application:
    name: background
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

#MyBatis-Plus Config
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）

# 接口文档配置：Knife4j Next 5.8.3（springdoc-openapi 3.0.3）
springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0        # ← 新增：输出 OpenAPI 3.0.1，供 @umijs/openapi 生成代码
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: background
      display-name: 后台管理接口
      paths-to-match:
        - /**
      packages-to-scan:
        - com.example.background.controller

knife4j:
  enable: true
  # production: true # 生产环境
  setting:
    language: zh_cn

server:
  port: 8080
